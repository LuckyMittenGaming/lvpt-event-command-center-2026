name: SMS Review Engine Tests

on:
  push:
    branches:
      - feature/lvpt-sms-intelligence-review
    paths:
      - 'public/sms-review/**'
      - 'tests/sms-review.test.js'
      - 'tests/sms-intelligence.test.mjs'
      - 'tests/sms-reconciliation.test.cjs'
      - 'tests/sms-evidence.test.cjs'
      - 'tests/sms-action-queue.test.cjs'
      - 'tests/sms-reply-qualification.test.cjs'
      - 'tests/sms-reply-review.test.cjs'
      - 'tests/sms-reply-send.test.cjs'
      - 'tests/sms-reply-send-ui.test.cjs'
      - 'tests/sms-reply-ai.test.cjs'
      - 'tests/sms-reply-send-runtime.test.cjs'
      - 'app/api/sms/staging/reply-personalized-draft/route.ts'
      - 'tests/sms-message-preview.test.cjs'
      - 'tests/sms-inbox-diagnostics.test.cjs'
      - 'tests/sms-inbox-diagnostics-autoselect.test.mjs'
      - 'tests/sms-diagnostic-message.test.mjs'
      - 'tests/sms-gas-long-thread-preview.test.cjs'
      - 'tests/sms-gas-recipient-verification.test.cjs'
      - 'lib/lvpt-diagnostic-message.mjs'
      - 'lib/lvpt-diagnostic-selection.mjs'
      - 'app/api/sms/staging/inbox-diagnostics/route.ts'
      - 'app/api/sms/staging/reply-send/route.ts'
      - 'app/api/sms/staging/reply-recipient/route.ts'
      - 'app/api/sms/staging/reply-decisions/route.ts'
      - 'tests/sms-draft-preview.test.cjs'
      - 'tests/sms-personalized-draft.test.cjs'
      - 'tests/sms-ai-smoke-test.test.cjs'
      - 'tests/sms-ai-oidc-auth.test.cjs'
      - 'lib/lvpt-ai-gateway-auth.ts'
      - 'app/api/sms/staging/ai-smoke-test/route.ts'
      - 'app/api/sms/staging/personalized-draft/route.ts'
      - 'lib/lvpt-personalized-policy.mjs'
      - 'apps-script/GmailDraftContext.gs'
      - 'apps-script/release/**'
      - 'app/api/sms/staging/draft-context/route.ts'
      - 'tests/gmail-thread-triage.test.cjs'
      - 'public/sms-review/gmail-thread-triage.js'
      - 'tests/sms-gmail-intelligence.test.cjs'
      - 'tests/sms-gmail-scope-static.test.cjs'
      - 'apps-script/appsscript.json'
      - 'apps-script/GmailEvidence.gs'
      - 'tests/sms-review-audit-static.test.cjs'
      - 'docs/staging-migrations/**'
      - 'apps-script/Code.gs'
      - 'tests/sms-review-session.test.mjs'
      - 'lib/sms-review-session.mjs'
      - 'app/api/sms/staging/_review-auth.ts'
      - 'app/api/sms/staging/session/route.ts'
      - 'app/api/sms/staging/decisions/route.ts'
      - 'app/api/sms/staging/audit-health/route.ts'
      - 'app/api/sms/staging/reconcile/route.ts'
      - 'app/api/sms/staging/gmail-evidence/route.ts'
      - 'lib/sms-intelligence.mjs'
      - 'app/api/sms/staging/review/route.ts'
      - '.github/workflows/sms-intelligence-review-ci.yml'
  pull_request:
    paths:
      - 'public/sms-review/**'
      - 'tests/**'
      - 'lib/**'
      - 'app/api/sms/staging/**'
      - 'apps-script/**'
      - 'docs/staging-migrations/**'
      - '.github/workflows/sms-intelligence-review-ci.yml'

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Runtime route tests transpile TypeScript; install dependencies first.
      - run: npm ci
      - run: node --check public/sms-review/review-engine.js
      - run: node --check public/sms-review/app.js
      - run: node --check public/sms-review/case-engine.js
      - run: node --check public/sms-review/reconciliation.js
      - run: node --check public/sms-review/evidence-overlap.js
      - run: node --check public/sms-review/gmail-thread-triage.js
      - run: node --check public/sms-review/gmail-intelligence.js
      - run: node --check public/sms-review/action-queue.js
      - run: node --check public/sms-review/reply-qualification.js
      - run: node --check public/sms-review/message-preview.js
      - run: node --check lib/lvpt-diagnostic-selection.mjs
      - run: node --check lib/lvpt-diagnostic-message.mjs
      - run: node --check public/sms-review/reply-workflow.js
      - run: node --check public/sms-review/reply-review-controls.js
      - run: node --check public/sms-review/draft-helper.js
      - run: node --check lib/sms-intelligence.mjs
      - run: node --check lib/lvpt-personalized-policy.mjs
      - run: node --check < apps-script/GmailEvidence.gs
      - run: node --check < apps-script/GmailDraftContext.gs
      - run: node --check < apps-script/release/LVPT_Event_Command_Center_v1_2_COMPLETE_Code.gs
      - run: node --check lib/sms-review-session.mjs
      - run: node tests/sms-review.test.js
      - run: node tests/sms-intelligence.test.mjs
      - run: node tests/sms-reconciliation.test.cjs
      - run: node tests/sms-evidence.test.cjs
      - run: node tests/sms-action-queue.test.cjs
      - run: node tests/sms-reply-qualification.test.cjs
      - run: node tests/sms-message-preview.test.cjs
      - run: node tests/sms-inbox-diagnostics.test.cjs
      - run: node tests/sms-inbox-diagnostics-autoselect.test.mjs
      - run: node tests/sms-diagnostic-message.test.mjs
      - run: node tests/sms-negative-gmail-canary.test.mjs
      - run: node tests/sms-gas-long-thread-preview.test.cjs
      - run: node tests/sms-gas-recipient-verification.test.cjs
      - run: node tests/sms-reply-review.test.cjs
      - run: node tests/sms-reply-send.test.cjs
      - run: node tests/sms-reply-send-runtime.test.cjs
      - run: node tests/sms-reply-send-ui.test.cjs
      - run: node tests/sms-reply-ai.test.cjs
      - run: node tests/sms-draft-preview.test.cjs
      - run: node tests/sms-personalized-draft.test.cjs
      - run: node tests/sms-ai-smoke-test.test.cjs
      - run: node tests/sms-ai-oidc-auth.test.cjs
      - run: node tests/gmail-thread-triage.test.cjs
      - run: node tests/sms-gmail-intelligence.test.cjs
      - run: node tests/sms-gmail-scope-static.test.cjs
      - run: node tests/sms-review-audit-static.test.cjs
      - run: node tests/sms-review-session.test.mjs
      - run: npx tsc --noEmit
