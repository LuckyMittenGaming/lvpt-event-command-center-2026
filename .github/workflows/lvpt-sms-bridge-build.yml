name: Build LVPT SMS Test APK

on:
  push:
    branches:
      - feature/lvpt-sms-bridge-prototype
    paths:
      - 'android-sms-bridge/**'
      - '.github/workflows/lvpt-sms-bridge-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install SDK 35 using the runner Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build private debug APK
        working-directory: android-sms-bridge
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Upload installable debug APK for LVPT-only testing
        uses: actions/upload-artifact@v4
        with:
          name: lvpt-sms-bridge-debug-apk
          path: android-sms-bridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
